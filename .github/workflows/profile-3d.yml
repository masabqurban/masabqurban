name: Generate 3D contribution graph

on:
  schedule:
    - cron: "0 19 * * *" # every day at 00:00 PKT (UTC+5)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-3d.yml", "scripts/patch-3d-contrib.mjs"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Pinned release, patched to hide the "other" pie slice and the fork counter
      - name: Get github-profile-3d-contrib v0.9.3
        run: git clone --quiet --depth 1 --branch v0.9.3 https://github.com/yoshi389111/github-profile-3d-contrib.git "$RUNNER_TEMP/p3d"

      - name: Patch
        run: node scripts/patch-3d-contrib.mjs "$RUNNER_TEMP/p3d/dist/index.js"

      - name: Generate 3D contribution SVGs
        run: node "$RUNNER_TEMP/p3d/dist/index.js"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git commit -m "Update 3D contribution graph"; then
            git pull --rebase
            git push
          fi
